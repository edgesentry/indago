name: Publish data to R2

# Canonical workflow that rescores all active streaming regions, validates
# watchlists, runs the public backtest, and publishes results to R2.
#
# Region pipelines run in parallel matrix jobs (one runner per region) so CPU
# and gdelt.lance are not contended. A final publish job aggregates watchlist
# artifacts, runs the backtest, and pushes to R2 / arktrace-public.
#
# Triggers:
#   - Automatically after AIS Upload Validation completes on main
#   - Manual dispatch

on:
  workflow_dispatch:
    inputs:
      download_days:
        description: "Days of AIS history to pull from R2 (default: 35; use 60+ for backfill)"
        required: false
        default: "35"
  workflow_run:
    workflows: ["AIS Upload Validation"]
    branches: ["main"]
    types: [completed]

permissions: {}

concurrency:
  group: data-publish
  cancel-in-progress: true

jobs:
  pipeline-region:
    name: Pipeline (${{ matrix.r2_region }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - r2_region: japansea
            pipeline_region: japan
          - r2_region: blacksea
            pipeline_region: blacksea
          - r2_region: middleeast
            pipeline_region: middleeast
          - r2_region: singapore
            pipeline_region: singapore
          - r2_region: europe
            pipeline_region: europe
    env:
      MARIDB_DATA_DIR: data/processed

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compute today (UTC) for cache key
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore AIS Parquet cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: data/downloads/ais
          key: ais-parquet-${{ matrix.r2_region }}-${{ steps.date.outputs.today }}
          restore-keys: |
            ais-parquet-${{ matrix.r2_region }}-

      - name: Pull region data from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          DOWNLOAD_DAYS=${{ inputs.download_days || '35' }}
          uv run python scripts/sync_r2.py pull-ais-parquet \
            --regions ${{ matrix.r2_region }} \
            --days "$DOWNLOAD_DAYS" \
            --data-dir data/downloads
          uv run python scripts/sync_r2.py pull-gfw-eo \
            || echo "::warning::pull-gfw-eo skipped or failed (non-fatal)"

      - name: Run pipeline
        run: |
          uv run python scripts/run_pipeline.py \
            --region ${{ matrix.pipeline_region }} \
            --non-interactive \
            --skip-gdelt

      - name: Upload region artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pipeline-${{ matrix.r2_region }}
          path: |
            data/processed/score/${{ matrix.r2_region }}_watchlist.parquet
            data/processed/score/${{ matrix.r2_region }}_ownership_graph.parquet
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Push to R2
    needs: pipeline-region
    if: ${{ !cancelled() && needs.pipeline-region.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MARIDB_DATA_DIR: data/processed

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # upload-artifact strips the common ancestor (score/), so each zip contains
      # bare *_watchlist.parquet files — extract directly into score/.
      - name: Download region pipeline artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: pipeline-*
          path: data/processed/score
          merge-multiple: true

      - name: Verify regional watchlists
        run: |
          missing=0
          for stem in singapore japansea blacksea middleeast europe; do
            f="data/processed/score/${stem}_watchlist.parquet"
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "::error::missing $f"
              missing=1
            fi
          done
          exit $missing

      - name: Run backtest (skip pipeline, use fresh watchlists)
        run: |
          uv run python scripts/run_public_backtest_batch.py \
            --regions singapore,japan,europe,blacksea,middleeast \
            --gdelt-days 14 \
            --seed-dummy \
            --skip-pipeline \
            --max-known-cases 200 \
            --min-known-cases 5

      - name: Push artifacts to R2
        id: push
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          uv run python scripts/sync_r2.py push 2>&1 | tee /tmp/push.log
          snapshot_id=$(grep -oP '\d{8}T\d{6}Z(?=\.zip pushed)' /tmp/push.log || echo "")
          snapshot_mb=$(grep -oP '[\d.]+(?= MB\.$)' /tmp/push.log | tail -1 || echo "")
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
          echo "snapshot_mb=$snapshot_mb" >> "$GITHUB_OUTPUT"

      - name: Seed demo files for push-demo
        run: |
          uv run python - <<'EOF'
          import json, os, shutil
          from pathlib import Path
          import polars as pl

          demo_dir = Path(os.environ.get("MARIDB_DATA_DIR", str(Path.home() / ".maridb" / "data")))
          demo_dir.mkdir(parents=True, exist_ok=True)
          processed = demo_dir

          src = processed / "candidate_watchlist.parquet"
          if not src.exists():
              src = demo_dir / "candidate_watchlist.parquet"
          dst_w = demo_dir / "candidate_watchlist.parquet"
          if src.exists() and src != dst_w and not dst_w.exists():
              shutil.copy2(src, dst_w)
              print(f"  candidate_watchlist.parquet ← {src}")
          elif not dst_w.exists():
              df = pl.DataFrame(schema={
                  "mmsi": pl.Utf8, "imo": pl.Utf8, "vessel_name": pl.Utf8,
                  "vessel_type": pl.Utf8, "confidence": pl.Float64,
              })
              df.write_parquet(dst_w)
              print("  candidate_watchlist.parquet ← empty schema (pipeline produced no candidates)")

          dst = demo_dir / "composite_scores.parquet"
          if src.exists() and not dst.exists():
              shutil.copy2(src, dst)
              print(f"  composite_scores.parquet ← {src}")

          dst_c = demo_dir / "causal_effects.parquet"
          if not dst_c.exists():
              df = pl.DataFrame(schema={
                  "regime": pl.Utf8, "label": pl.Utf8,
                  "n_treated": pl.Int32, "n_control": pl.Int32,
                  "att_estimate": pl.Float64, "att_ci_lower": pl.Float64,
                  "att_ci_upper": pl.Float64, "p_value": pl.Float64,
                  "is_significant": pl.Boolean, "calibrated_weight": pl.Float64,
              })
              df.write_parquet(dst_c)
              print("  causal_effects.parquet ← empty schema (no full pipeline in CI)")

          dst_sh = demo_dir / "score_history.parquet"
          if not dst_sh.exists():
              import random
              from datetime import date, timedelta
              watchlist_path = demo_dir / "candidate_watchlist.parquet"
              _empty_sh = pl.DataFrame(schema={"mmsi": pl.Utf8, "score_date": pl.Utf8, "confidence": pl.Float32})
              if watchlist_path.exists():
                  wl = pl.read_parquet(watchlist_path)
                  if wl.height > 0 and "mmsi" in wl.columns and "confidence" in wl.columns:
                      rng = random.Random(42)
                      anchor = date.today()
                      days = 30
                      rows = []
                      for mmsi, base_conf in zip(wl["mmsi"].to_list(), wl["confidence"].to_list()):
                          conf = float(base_conf)
                          for d in range(days):
                              score_date = (anchor - timedelta(days=days - 1 - d)).isoformat()
                              conf = max(0.1, min(0.99, conf + rng.uniform(-0.04, 0.04)))
                              rows.append({"mmsi": mmsi, "score_date": score_date, "confidence": round(conf, 4)})
                      sh = pl.DataFrame(rows).with_columns(pl.col("confidence").cast(pl.Float32))
                      sh.write_parquet(dst_sh)
                      print(f"  score_history.parquet ← generated ({len(sh)} rows)")
                  else:
                      _empty_sh.write_parquet(dst_sh)
                      print("  score_history.parquet ← empty schema (watchlist has no candidates)")
              else:
                  _empty_sh.write_parquet(dst_sh)
                  print("  score_history.parquet ← empty schema (no watchlist)")

          dst_m = demo_dir / "validation_metrics.json"
          if not dst_m.exists():
              report_path = processed / "backtest_report_public_integration.json"
              metrics = {}
              if report_path.exists():
                  report = json.loads(report_path.read_text())
                  s = report.get("summary", {})
                  metrics = {
                      "auroc": s.get("auroc"),
                      "precision_at_50": s.get("precision_at_50"),
                      "recall_at_200": s.get("recall_at_200"),
                      "recall_at_25": s.get("recall_at_25"),
                      "false_negatives": s.get("false_negatives"),
                      "calibration_error": s.get("calibration_error"),
                  }
              dst_m.write_text(json.dumps(metrics, indent=2))
              print(f"  validation_metrics.json ← {metrics}")

          print("Seed demo files complete.")
          EOF

      - name: Push demo bundle to R2 (public, no-auth download)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: uv run python scripts/sync_r2.py push-demo

      - name: Push OpenSanctions DB to R2 (push-sanctions-db)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          uv run python scripts/sync_r2.py push-sanctions-db --force \
            --data-dir data/processed

      - name: Push updated watchlists to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: uv run python scripts/sync_r2.py push-watchlists

      - name: Distribute to arktrace-public
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: uv run python scripts/sync_r2.py push-arktrace

      - name: Lead time validation (#268)
        run: |
          uv run python scripts/validate_lead_time_ofac.py \
            --watchlist "${MARIDB_DATA_DIR:-data/processed}/candidate_watchlist.parquet" \
            --out data/processed/lead_time_report.json

      - name: Push metrics snapshot to R2 (#104)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: uv run python scripts/push_metrics_snapshot.py

      - name: Send metrics email (#210)
        if: always()
        env:
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SNAPSHOT_ID: ${{ steps.push.outputs.snapshot_id }}
          SNAPSHOT_SIZE_MB: ${{ steps.push.outputs.snapshot_mb }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/notify_metrics.py

      - name: Upload artifacts (fallback — available even if R2 push fails)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pipeline-artifacts-${{ github.run_id }}
          path: |
            data/processed/*.parquet
            data/processed/score/*.parquet
            data/processed/*.json
          if-no-files-found: warn
          retention-days: 7
